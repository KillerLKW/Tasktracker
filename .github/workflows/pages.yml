name: Publish tasktracker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          for file in index.html styles.css app.js storage.js logo.svg apple-touch-icon.png; do
            test -f "$file"
            test ! -L "$file"
            cp -- "$file" "_site/$file"
          done
          sed -i 's/<html lang="de">/<html lang="de" data-hosting="github-pages">/' _site/index.html
          grep -q 'data-hosting="github-pages"' _site/index.html
          touch _site/.nojekyll
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
