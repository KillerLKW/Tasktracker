name: Publish tasktracker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website files
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check storage.js
          node --check cloud.js
          mkdir _site
          for file in index.html styles.css app.js storage.js cloud.js logo.svg apple-touch-icon.png supabase/setup.sql supabase/README.md; do
            test -f "$file"
            test ! -L "$file"
            mkdir -p -- "_site/$(dirname "$file")"
            cp -- "$file" "_site/$file"
          done
          sed -i 's/<html lang="de">/<html lang="de" data-hosting="github-pages">/' _site/index.html
          grep -q 'data-hosting="github-pages"' _site/index.html
          touch _site/.nojekyll
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" = "1" ]; then
              echo "Pages artifact is available."
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple Pages artifacts found; refusing an ambiguous deployment."
              exit 1
            fi
            echo "Waiting for Pages artifact metadata (attempt $attempt/20)."
            sleep 3
          done
          echo "::error::Pages artifact metadata did not become available."
          exit 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
